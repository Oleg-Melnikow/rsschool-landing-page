<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Coffee House</title>
</head>
<body>
  <header class="header">
    <a href="#" class="header__logo">
      <img src="./assets/logo.svg" alt="logo" />
    </a>
    <nav class="header__nav">
      <ul class="nav__list">
        <li class="nav__item">
          <a href="#" class="nav__link">Favorite coffee</a>
        </li>
        <li class="nav__item">
          <a href="#" class="nav__link">About</a>
        </li>
        <li class="nav__item">
          <a href="#" class="nav__link">Mobile app</a>
        </li>
        <li class="nav__item">
          <a href="#" class="nav__link">Contact us</a>
        </li>
      </ul>
    </nav>
    <div class="header__actions">
      <button class="theme-toggle" aria-label="theme-toggle">
        <span class="theme-toggle__icon">
          <img src="./assets/Sun.svg" alt="sun" />
        </span>
        <span class="theme-toggle__icon">
          <img src="./assets/Moon.svg" alt="Moon" />
        </span>
      </button>
      <a href="#" class="menu-btn">
        <span class="menu-btn__text">Menu</span>
        <span class="menu-btn__icon">
          <img src="./assets/coffee-cup.svg" alt="coffee-cup" />
        </span>
      </a>
    </div>
  </header>
</body>
</html>
